[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawed"
version = "6.19.2026.2"
description = "Your AI co-teacher. Generate lessons, games, slides, and assessments from your terminal. Learns your teaching voice, aligns to your state standards, and works with any LLM provider."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jon Maccarello & Claw-ED contributors" },
]
keywords = [
    "ai", "lesson-planner", "teaching-assistant", "education",
    "curriculum", "lesson-plan-generator", "edtech", "k12",
    "open-source-education", "teacher-tools", "ai-for-teachers",
    "lesson-planning", "pedagogy", "hermes-agent", "teachers",
    "lesson-plans", "clawed", "claw-ed", "teaching", "manim",
    "animation", "educational-videos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.9.0,<1.0",
    "rich>=13.0.0,<14.0",
    "pydantic>=2.0.0,<3.0",
    "httpx>=0.25.0,<1.0",
    "anthropic>=0.39.0,<1.0",
    "openai>=1.50.0,<2.0",
    # v4.11.2026: replaced PyMuPDF (AGPL-3.0) with pypdf (MIT) for
    # license compatibility with our declared MIT license.
    "pypdf>=6.10.2,<7.0",
    "python-docx>=1.0.0,<2.0",
    "python-pptx>=0.6.21,<2.0",
    "lxml>=4.9.0,<7.0",
    # 4.4.10 imports rl_extended_literal_eval from reportlab.lib.utils where
    # that symbol is absent, breaking PDF export during import.
    "reportlab>=4.0.0,<5.0,!=4.4.10",
    "Jinja2>=3.1.0,<4.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "python-multipart>=0.0.6,<1.0",
    "sse-starlette>=1.6.0,<3.0",
    "mcp>=1.0.0,<2.0",
    "json-repair>=0.30.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "apscheduler>=3.10.0,<4.0",
    "urllib3>=2.5.0,<3.0",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.0.0,<3.0",
    "google-auth-oauthlib>=1.0.0,<2.0",
]
browser = ["playwright>=1.40.0,<2.0"]
voice = ["faster-whisper>=0.10.0,<2.0"]
tts = ["gTTS>=2.5.0,<3.0"]
tui = ["textual>=0.56.0,<2.0"]
memory = ["onnxruntime>=1.16.0,<2.0"]
animations = ["manim>=0.18.0,<1.0", "av>=12.0,<18.0"]
all = [
    "faster-whisper>=0.10.0,<2.0",
    "gTTS>=2.5.0,<3.0",
    "textual>=0.56.0,<2.0",
    "keyring>=24.0.0,<26.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "onnxruntime>=1.16.0,<2.0",
    "qrcode[pil]>=7.0,<9.0",
]
formats = ["xlrd>=2.0.0,<3.0", "striprtf>=0.0.26,<1.0"]
pdf = ["weasyprint>=60.0,<70.0"]
qr = ["qrcode[pil]>=7.0,<9.0"]
keyring = ["keyring>=24.0.0,<26.0"]
# v4.11.2026: pdf-rich opt-in for PyMuPDF's richer extractor. Users
# who need advanced PDF parsing can install this extra and accept the
# AGPL license implications; the base install is MIT-clean via pypdf.
pdf-rich = ["pymupdf>=1.23.0,<2.0"]
dev = [
    "build>=1.0.0,<2.0",
    "mypy>=1.10.0,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.21.0,<2.0",
    "pytest-cov>=4.0,<7.0",
    "ruff>=0.1.0,<1.0",
    "types-PyYAML>=6.0.0,<7.0",
    "types-python-dateutil>=2.9.0,<3.0",
    "types-pytz>=2025.0.0,<2027.0.0",
    "types-qrcode>=8.2.0,<9.0",
    "types-reportlab>=4.4.0,<5.0",
    "apscheduler>=3.10.0,<4.0",
    "faster-whisper>=0.10.0,<2.0",
]

[project.scripts]
clawed = "clawed._entry_router:main"
eduagent = "clawed._entry_router:main"

[project.urls]
Homepage = "https://sirhanmacx.github.io/Claw-ED"
Documentation = "https://github.com/SirhanMacx/Claw-ED#readme"
Repository = "https://github.com/SirhanMacx/Claw-ED"
"Bug Tracker" = "https://github.com/SirhanMacx/Claw-ED/issues"
Changelog = "https://github.com/SirhanMacx/Claw-ED/blob/main/CHANGELOG.md"
"PyPI" = "https://pypi.org/project/clawed/"

[tool.hatch.build.targets.wheel]
packages = ["clawed", "eduagent"]
exclude = ["clawed/_cli_bundle/.gitkeep"]

[tool.hatch.build.targets.wheel.force-include]
"clawed/_cli_bundle" = "clawed/_cli_bundle"

[tool.hatch.build.targets.sdist]
include = ["clawed/**", "eduagent/**", "daemon/**", "scripts/**"]
exclude = ["clawed/_cli_bundle/.gitkeep"]

[tool.hatch.build.targets.sdist.force-include]
"clawed/_cli_bundle" = "clawed/_cli_bundle"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in education content strings
    "RUF002",  # ambiguous unicode in docstrings
    "RUF012",  # mutable class defaults — existing patterns are intentional
    "SIM102",  # collapsible-if — readability preference
    "SIM105",  # suppressible-exception — explicit try/except is clearer
    "SIM108",  # ternary expression — readability preference
    "SIM113",  # enumerate-for-loop — context-dependent
    "B007",    # unused-loop-control-variable — naming convention
    "B008",    # function-call-in-default-argument — FastAPI Depends pattern
    "B018",    # useless-expression — docstring test pattern
    "UP042",   # replace-str-enum — (str, Enum) is portable across versions
]

[tool.ruff.lint.per-file-ignores]
"clawed/export_docx.py" = ["N806"]
"clawed/export_pptx.py" = ["N806"]
"clawed/export_handout.py" = ["N806"]
# Tests: unused unpacked vars and nested withs are common patterns.
"tests/**" = ["RUF059", "SIM117", "SIM300", "SIM110", "RUF005", "B033"]
# Scripts: one-off utilities with looser hygiene requirements.
"scripts/**" = ["RUF059", "SIM110", "B033"]
# Compat shim re-exports everything from clawed.
"eduagent/__init__.py" = ["RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Narrow relaxations for parts of the codebase that interact with
# dynamically-typed APIs. Keep this list small — prefer annotating
# the code over widening exemptions.

[[tool.mypy.overrides]]
module = [
    # Third-party libraries without type stubs.
    "anthropic",
    "anthropic.*",
    "apscheduler.*",
    "faster_whisper",
    "google",
    "google.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "googleapiclient",
    "googleapiclient.*",
    "gtts",
    "keyring",
    "lxml",
    "lxml.*",
    "manim",
    "manim.*",
    "numpy",
    "numpy.*",
    "onnxruntime",
    "openpyxl",
    "playwright.*",
    "pypdf",
    "pypdf.*",
    "striprtf.*",
    "textual.*",
    "tokenizers",
    "weasyprint",
    "xlrd",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["clawed"]
omit = [
    # Optional transports requiring external services / heavy deps
    "clawed/transports/telegram.py",
    "clawed/transports/student_telegram.py",
    "clawed/transports/cli.py",
    "clawed/transports/web.py",
    # Interactive TUI (requires terminal)
    "clawed/tui.py",
    "clawed/tui_chat.py",
    # Optional features with heavy native deps
    "clawed/tts.py",
    "clawed/voice.py",
    "clawed/student_cli.py",
]

[tool.coverage.report]
show_missing = true
# Core agent/API coverage is 85%+.  The aggregate drops because
# optional transports (Telegram, TUI, voice, TTS) require external
# services that CI cannot provide.  Threshold set to prevent
# regressions in the testable core.
fail_under = 50
branch = true
