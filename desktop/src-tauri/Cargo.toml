[package]
name = "clawed-desktop"
version = "0.1.0"
description = "Claw-ED for Mac — the native desktop agent app"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
