name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Type check with mypy
        run: mypy --strict clawed
      - name: Run tests with coverage
        run: |
          ulimit -n 4096
          pytest --tb=short -q --cov=clawed --cov-report=term --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  wheel-build:
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Verify wheel size
        run: |
          ls -lh dist/*.whl
          WHEEL_SIZE=$(stat -c%s dist/*.whl 2>/dev/null || stat -f%z dist/*.whl)
          MAX_SIZE=$((5 * 1024 * 1024))
          if [ "$WHEEL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Wheel too large ($WHEEL_SIZE bytes)"
            exit 1
          fi
      - name: Smoke test wheel CLI version
        run: |
          pip install dist/*.whl
          clawed --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  docker-build:
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      # v4.11.2026: harmonized with the other jobs which use @v5.
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t clawed:test .
      - name: Smoke test container
        run: |
          docker run --rm clawed:test clawed --version

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel-build, docker-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
